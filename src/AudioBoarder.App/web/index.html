<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>AudioBoarder Whiteboard</title>
    <link rel="stylesheet" href="/src/canvas.css" />
  </head>
  <body>
    <aside id="library" class="library" aria-label="Microsoft component library">
      <div class="library-head">
        <strong>Components</strong>
        <button id="libraryToggle" title="Collapse component library" aria-label="Collapse component library">&lsaquo;</button>
      </div>
      <input id="componentSearch" type="search" placeholder="Search Azure, Microsoft 365, on-prem..." autocomplete="off" />
      <div id="componentResults" class="component-results"></div>
      <a id="componentSource" class="component-source" target="_blank" rel="noreferrer">Azure Architecture Center</a>
    </aside>
    <div id="stage"><svg id="canvas"></svg></div>

    <div class="zoom">
      <button id="zoomOut" title="Zoom out">&minus;</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomFit" title="Fit to content">Fit</button>
    </div>

    <script type="module" src="/src/main-canvas.js"></script>
  </body>
</html>
