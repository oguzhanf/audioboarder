name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build SVG canvas
        shell: pwsh
        run: .\src\AudioBoarder.App\web\build-bundle.ps1
      - name: Verify SVG canvas in Edge
        shell: pwsh
        run: .\src\AudioBoarder.App\web\verify.ps1
      - name: Restore
        run: dotnet restore AudioBoarder.sln
      - name: Build
        run: dotnet build AudioBoarder.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test AudioBoarder.sln --configuration Release --no-build --filter "Category!=LiveModel" --logger "trx;LogFileName=ci-results.trx"
      - name: Repository privacy scan
        shell: pwsh
        run: .\scripts\scan-repository.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
